name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog and app
        run: |
          test ! -d __qa
          python3 build-catalog.py
          python3 validate_release.py
          node --check app.js
          node --check knowledge.js
          python3 -m unittest test_prepare_site.py test_catalog_contract.py
          python3 exporter/test_web_grids.py
      - name: Prepare static files
        run: |
          python3 prepare_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
