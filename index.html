<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="UniLand — предметы и рецепты TechnoMagic RPG.">
  <title>UniLand · TechnoMagic RPG</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="brand" id="home-button" type="button" aria-label="UniLand — все крафты"><img src="logo.svg" alt="UniLand" width="111" height="24"></button>
      <nav class="header-navigation" aria-label="Разделы каталога">
        <button class="nav-button active" id="catalog-nav" type="button" aria-pressed="true"><span data-icon="cube"></span><span>Крафты</span></button>
        <button class="nav-button" id="favorite-items" type="button" aria-label="Избранное" aria-pressed="false"><span data-icon="star"></span><span>Избранное</span></button>
      </nav>
    </div>
  </header>
  <main class="page-shell">
    <section class="page-heading" id="page-heading">
      <h1 class="sr-only" id="page-title">Крафты</h1>
      <p class="server-name">TechnoMagic RPG</p>
      <span class="result-count" id="result-count" aria-live="polite"></span>
    </section>
    <section class="workspace-shell" aria-label="Предметы и рецепты">
      <div class="content empty-catalog" id="content">
        <section class="catalog" id="catalog" aria-label="Каталог предметов"><div class="items-grid" id="items-grid" aria-label="Предметы"></div><div class="empty-state" id="empty-state"><span class="empty-symbol" data-icon="cube"></span><h2>Загрузка…</h2></div><button class="load-more" id="load-more" type="button" hidden>Показать ещё</button></section>
        <aside class="inspector" id="inspector" aria-label="Рецепты предмета"></aside>
      </div>
    </section>
  </main>
  <div class="toolbar" id="toolbar">
    <label class="mod-filter"><span class="sr-only">Модификация</span><select id="mod-filter"><option value="">Все моды</option></select><span class="select-chevron" data-icon="down"></span></label>
    <div class="search"><span data-icon="search"></span><input id="search-input" type="search" placeholder="Найти предмет или @мод" aria-label="Поиск по названию, ID или @моду" autocomplete="off" spellcheck="false"><button class="icon-button search-clear" id="clear-search" type="button" aria-label="Очистить поиск" hidden><span data-icon="close"></span></button><kbd id="search-shortcut">/</kbd></div>
  </div>
  <div class="inspector-scrim" id="inspector-scrim" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
