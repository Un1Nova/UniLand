<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#010012">
  <meta name="description" content="Каталог предметов и рецептов TechnoMagic RPG от сообщества LoliLand.">
  <title>Крафты · TechnoMagic RPG</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="brand" id="home-button" type="button" aria-label="LoliLand — все крафты"><img src="logo.svg" alt="LoliLand" width="111" height="24"></button>
      <nav class="header-navigation" aria-label="Разделы каталога">
        <button class="nav-button active" id="catalog-nav" type="button" aria-pressed="true"><span data-icon="cube"></span><span>Крафты</span></button>
        <button class="nav-button" id="favorite-items" type="button" aria-label="Избранное" aria-pressed="false"><span data-icon="star"></span><span>Избранное</span></button>
        <a class="nav-link" href="https://loliland.ru/ru" target="_blank" rel="noopener noreferrer"><span>Сайт проекта</span><span data-icon="external"></span></a>
      </nav>
      <button class="settings-control" id="settings-button" type="button" aria-label="О базе рецептов"><span data-icon="info"></span><span>О базе</span></button>
    </div>
  </header>
  <main class="page-shell">
    <section class="page-heading" id="page-heading">
      <div><p class="server-name">TechnoMagic RPG</p><h1 id="page-title">Каталог крафтов</h1></div>
      <button class="data-state" id="data-state" type="button" title="Актуальность данных"><span class="status-dot"></span><span id="status-text">Загрузка</span><span data-icon="down"></span></button>
    </section>
    <section class="workspace-shell" aria-label="Предметы и рецепты">
      <div class="toolbar" id="toolbar">
        <div class="search"><span data-icon="search"></span><input id="search-input" type="search" placeholder="Название предмета или @мод" aria-label="Поиск по названию, ID или @моду" autocomplete="off" spellcheck="false"><button class="icon-button search-clear" id="clear-search" type="button" aria-label="Очистить поиск" hidden><span data-icon="close"></span></button><kbd id="search-shortcut">/</kbd></div>
        <div class="filters"><label class="mod-filter"><span class="sr-only">Модификация</span><select id="mod-filter"><option value="">Все моды</option></select><span data-icon="down"></span></label><button class="filter-button" id="recipe-filter" type="button" aria-pressed="false">С крафтом</button></div>
        <span class="result-count" id="result-count" aria-live="polite"></span>
      </div>
      <div class="content empty-catalog" id="content">
        <section class="catalog" id="catalog" aria-label="Каталог предметов"><div class="items-grid" id="items-grid" aria-label="Предметы"></div><div class="empty-state" id="empty-state"><span class="empty-symbol" data-icon="cube"></span><h2>Загрузка…</h2></div><button class="load-more" id="load-more" type="button" hidden>Показать ещё</button></section>
        <aside class="inspector" id="inspector" aria-label="Рецепты предмета"></aside>
      </div>
    </section>
    <footer class="site-footer" id="site-footer"><span>TechnoMagic RPG</span><span>Каталог сообщества</span></footer>
  </main>
  <div class="inspector-scrim" id="inspector-scrim" hidden></div>
  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title">О базе</h2><button class="icon-button" type="button" id="close-settings" aria-label="Закрыть"><span data-icon="close"></span></button></div><div id="settings-content"></div></dialog>
  <script src="app.js" defer></script>
</body>
</html>
